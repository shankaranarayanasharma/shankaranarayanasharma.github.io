<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="swiftuiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A56DB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7E3AF2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E74694;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#swiftuiGrad)" />
  <!-- SwiftUI diamond/infinity symbol simplified -->
  <ellipse cx="37" cy="50" rx="16" ry="10" fill="none" stroke="white" stroke-width="5"/>
  <ellipse cx="63" cy="50" rx="16" ry="10" fill="none" stroke="white" stroke-width="5"/>
  <!-- Label -->
  <text x="50" y="82" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="white" text-anchor="middle" letter-spacing="0.5">SwiftUI</text>
</svg>
